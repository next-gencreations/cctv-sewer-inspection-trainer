<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CCTV Sewer Inspection Course | MSCC 5 + WinCan Style</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --panel2: #243044;
      --accent: #a435f0;
      --accent2: #8710d8;
      --teal: #00b4d8;
      --success: #2ecc71;
      --warn: #f39c12;
      --danger: #e74c3c;
      --text: #e8eef5;
      --muted: #8b9bb4;
      --border: #2d3a4f;
      --sidebar-w: 280px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }
    a { color: var(--teal); }

    /* ===== LAYOUT ===== */
    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: var(--sidebar-w);
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 200;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-header h1 { font-size: 1rem; font-weight: 700; }
    .sidebar-header .sub { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
    .progress-wrap { margin-top: 12px; }
    .progress-bar-bg {
      height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; background: var(--accent); width: 0%; transition: width 0.3s;
    }
    .progress-text { font-size: 0.7rem; color: var(--muted); margin-top: 4px; }

    .curriculum { flex: 1; overflow-y: auto; padding: 8px 0; }
    .section-title {
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--muted); padding: 12px 16px 6px; font-weight: 600;
    }
    .lesson {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 16px; cursor: pointer; border-left: 3px solid transparent;
      font-size: 0.88rem; line-height: 1.3;
    }
    .lesson:hover, .lesson.active { background: rgba(164,53,240,0.12); border-left-color: var(--accent); }
    .lesson.completed .lesson-icon { color: var(--success); }
    .lesson-icon {
      width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; flex-shrink: 0; margin-top: 1px;
      color: var(--muted);
    }
    .lesson.active .lesson-icon { border-color: var(--accent); color: var(--accent); }
    .lesson-title { flex: 1; }
    .lesson-dur { font-size: 0.7rem; color: var(--muted); }

    .main {
      flex: 1; margin-left: 0; min-height: 100vh;
      display: flex; flex-direction: column;
    }
    .topbar {
      background: var(--panel);
      padding: 12px 16px;
      display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .menu-btn {
      background: none; border: none; color: var(--text);
      font-size: 1.4rem; cursor: pointer; padding: 4px 8px;
    }
    .topbar h2 { font-size: 1rem; font-weight: 600; flex: 1; }
    .topbar .badge {
      background: var(--accent2); color: white;
      font-size: 0.65rem; padding: 3px 8px; border-radius: 10px;
    }

    .content { flex: 1; padding: 20px 16px 40px; max-width: 820px; margin: 0 auto; width: 100%; }

    /* Desktop sidebar always visible */
    @media (min-width: 900px) {
      .sidebar { transform: translateX(0); }
      .main { margin-left: var(--sidebar-w); }
      .menu-btn { display: none; }
    }

    /* Overlay for mobile */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 150; display: none;
    }
    .overlay.show { display: block; }

    /* ===== COMPONENTS ===== */
    .btn {
      background: var(--accent); color: #fff; border: none;
      padding: 12px 20px; border-radius: 8px; font-size: 0.95rem;
      font-weight: 600; cursor: pointer; transition: background 0.15s;
    }
    .btn:active { background: var(--accent2); }
    .btn-secondary { background: var(--panel2); border: 1px solid var(--border); color: var(--text); }
    .btn-teal { background: var(--teal); }
    .btn-success { background: var(--success); }
    .btn-sm { padding: 8px 14px; font-size: 0.85rem; }
    .btn-block { width: 100%; display: block; text-align: center; }
    .btn-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1; min-width: 120px; }

    .card {
      background: var(--panel); border-radius: 12px; padding: 18px;
      border: 1px solid var(--border); margin-bottom: 16px;
    }
    .card h3 { font-size: 1.05rem; margin-bottom: 10px; color: var(--teal); }
    .card p, .card li { font-size: 0.92rem; line-height: 1.55; color: var(--text); }
    .card ul { padding-left: 1.2em; margin: 8px 0; }
    .card li { margin-bottom: 6px; }

    .lesson-header {
      margin-bottom: 20px;
    }
    .lesson-header h1 { font-size: 1.45rem; margin-bottom: 6px; }
    .lesson-header .meta { font-size: 0.8rem; color: var(--muted); }

    .code-table {
      width: 100%; border-collapse: collapse; font-size: 0.82rem; margin: 12px 0;
    }
    .code-table th, .code-table td {
      border: 1px solid var(--border); padding: 8px 10px; text-align: left;
    }
    .code-table th { background: var(--panel2); color: var(--teal); font-weight: 600; }
    .code-table tr:nth-child(even) { background: rgba(255,255,255,0.02); }
    .code-table .c { font-weight: 700; color: var(--accent); font-family: monospace; }

    .quiz-q {
      background: var(--panel2); border-radius: 10px; padding: 14px; margin-bottom: 12px;
    }
    .quiz-q .qtext { font-weight: 600; margin-bottom: 10px; }
    .quiz-opt {
      display: block; padding: 10px 12px; margin: 6px 0;
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      cursor: pointer; font-size: 0.9rem;
    }
    .quiz-opt:hover { border-color: var(--accent); }
    .quiz-opt.selected { border-color: var(--accent); background: rgba(164,53,240,0.15); }
    .quiz-opt.correct { border-color: var(--success); background: rgba(46,204,113,0.15); }
    .quiz-opt.wrong { border-color: var(--danger); background: rgba(231,76,60,0.12); }

    .scenario {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px; margin-bottom: 12px; cursor: pointer;
    }
    .scenario:active { border-color: var(--accent); }
    .scenario h3 { font-size: 1.05rem; margin-bottom: 4px; }
    .scenario .meta { font-size: 0.8rem; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
    .diff {
      display: inline-block; font-size: 0.7rem; padding: 2px 8px;
      border-radius: 10px; margin-top: 8px;
    }
    .diff-easy { background: #1a3a2a; color: #2ecc71; }
    .diff-med { background: #3a2e1a; color: #f39c12; }
    .diff-hard { background: #3a1a1a; color: #e74c3c; }

    /* Simulator styles */
    .video-stage {
      position: relative; background: #111; aspect-ratio: 16/10;
      max-height: 38vh; overflow: hidden; border-radius: 10px;
      border: 2px solid var(--border); margin-bottom: 12px;
    }
    .pipe-view {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #1a2535 0%, #0a0e14 70%);
    }
    .pipe-circle {
      width: min(60vw, 240px); height: min(60vw, 240px); border-radius: 50%;
      border: 8px solid #3a4a5c;
      background: radial-gradient(circle at 40% 35%, #2a3545 0%, #151c28 60%, #0d121a 100%);
      position: relative; box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
      overflow: hidden;
    }
    .pipe-inner {
      position: absolute; inset: 12%; border-radius: 50%;
      border: 2px solid #2a3548;
      background: radial-gradient(circle at 45% 40%, #1e2a3a, #0c1118);
    }
    .defect-overlay {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .defect-badge {
      background: rgba(231,76,60,0.85); color: white; padding: 6px 14px;
      border-radius: 20px; font-size: 0.85rem; font-weight: 600;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50% { opacity:0.7; transform:scale(1.05); }
    }
    .distance-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.75); padding: 8px 12px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.85rem; font-variant-numeric: tabular-nums;
    }
    .distance-bar .progress {
      flex: 1; height: 4px; background: #2a3545; border-radius: 2px; margin: 0 12px; overflow: hidden;
    }
    .distance-bar .progress-fill { height: 100%; background: var(--teal); width: 0%; transition: width 0.2s; }

    .controls {
      display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap;
    }
    .defect-info {
      background: var(--panel2); border-radius: 8px; padding: 12px;
      font-size: 0.9rem; line-height: 1.45; min-height: 64px; margin-bottom: 12px;
    }
    .defect-info .title { color: var(--teal); font-weight: 600; margin-bottom: 4px; }
    .defect-info .desc { color: var(--muted); }

    .obs-item {
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px; margin-bottom: 8px; font-size: 0.85rem;
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    .obs-item .code { font-weight: 700; color: var(--accent); }
    .obs-item .meta { color: var(--muted); font-size: 0.75rem; }
    .obs-item .remove { background: none; border: none; color: var(--danger); font-size: 1.1rem; cursor: pointer; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 300;
      display: none; align-items: flex-end; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--panel); width: 100%; max-width: 500px; max-height: 90vh;
      border-radius: 16px 16px 0 0; overflow-y: auto; padding: 20px 16px 32px;
    }
    .modal h2 { font-size: 1.15rem; margin-bottom: 14px; }
    .code-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .code-tab {
      padding: 6px 12px; border-radius: 16px; font-size: 0.78rem;
      background: var(--bg); border: 1px solid var(--border); color: var(--muted); cursor: pointer;
    }
    .code-tab.active { background: var(--accent2); color: white; border-color: var(--accent2); }
    .code-list {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      margin-bottom: 14px; max-height: 200px; overflow-y: auto;
    }
    .code-btn {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      padding: 10px 8px; border-radius: 8px; font-size: 0.78rem; text-align: left; cursor: pointer;
    }
    .code-btn.selected { border-color: var(--accent); background: rgba(164,53,240,0.15); }
    .code-btn .c { font-weight: 700; color: var(--accent); }
    .clock-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 10px; }
    .clock-btn {
      aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 0.85rem; cursor: pointer;
    }
    .clock-btn.selected { background: var(--accent2); border-color: var(--accent); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-group { margin-bottom: 10px; }
    .form-group.full { grid-column: 1 / -1; }
    label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
    input, select {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); padding: 10px 12px; border-radius: 8px; font-size: 1rem;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); }

    /* WinCan Report Sheet */
    .wincan-sheet {
      background: #f8f9fa; color: #1a1a1a; border-radius: 8px;
      padding: 20px; font-size: 0.82rem; line-height: 1.4;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .wincan-sheet h2 {
      font-size: 1.1rem; color: #003366; border-bottom: 2px solid #003366;
      padding-bottom: 6px; margin-bottom: 12px;
    }
    .wincan-sheet .header-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; margin-bottom: 14px;
    }
    .wincan-sheet .header-grid div { font-size: 0.8rem; }
    .wincan-sheet .header-grid span { color: #555; }
    .wincan-sheet table {
      width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.75rem;
    }
    .wincan-sheet th, .wincan-sheet td {
      border: 1px solid #ccc; padding: 5px 6px; text-align: left;
    }
    .wincan-sheet th { background: #003366; color: white; font-weight: 600; }
    .wincan-sheet tr:nth-child(even) { background: #eef2f7; }
    .wincan-sheet .summary-box {
      background: #e8f0fe; border: 1px solid #003366; border-radius: 6px;
      padding: 10px 14px; margin-top: 12px;
    }
    .wincan-sheet .logo {
      font-weight: 800; color: #003366; font-size: 1rem; letter-spacing: 0.02em;
    }
    .print-hint { font-size: 0.75rem; color: var(--muted); margin-top: 10px; text-align: center; }

    .score-big { text-align: center; padding: 20px; }
    .score-big .num { font-size: 3.2rem; font-weight: 700; color: var(--accent); }
    .score-big .label { color: var(--muted); }

    .feedback-item {
      padding: 12px; border-radius: 8px; margin-bottom: 8px;
      font-size: 0.9rem; border-left: 4px solid;
    }
    .feedback-item.good { background: rgba(46,204,113,0.1); border-color: var(--success); }
    .feedback-item.bad { background: rgba(231,76,60,0.1); border-color: var(--danger); }
    .feedback-item .expected { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }

    .cert {
      background: linear-gradient(135deg, #1a2332, #243044);
      border: 2px solid var(--accent); border-radius: 12px;
      padding: 28px 20px; text-align: center; margin: 20px 0;
    }
    .cert h2 { color: var(--accent); font-size: 1.3rem; margin-bottom: 8px; }
    .cert .name { font-size: 1.4rem; font-weight: 700; margin: 12px 0; }
    .cert .date { color: var(--muted); font-size: 0.85rem; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <div class="app">
    <!-- SIDEBAR / CURRICULUM -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1>CCTV Inspection Mastery</h1>
        <div class="sub">MSCC 5 · WinCan-style · Practical</div>
        <div class="progress-wrap">
          <div class="progress-bar-bg"><div class="progress-bar-fill" id="courseProgress"></div></div>
          <div class="progress-text" id="progressText">0% complete</div>
        </div>
      </div>
      <nav class="curriculum" id="curriculum"></nav>
    </aside>

    <!-- MAIN -->
    <div class="main">
      <div class="topbar">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <h2 id="topTitle">Course</h2>
        <span class="badge">MSCC 5</span>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>

  <!-- CODE MODAL (shared) -->
  <div class="modal-overlay" id="codeModal">
    <div class="modal">
      <h2>Code Observation <span id="modalDist" style="font-size:0.85rem;color:var(--muted)"></span></h2>
      <div class="code-tabs" id="codeTabs"></div>
      <div class="code-list" id="codeList"></div>
      <div class="form-group">
        <label>Selected Code</label>
        <input type="text" id="selectedCode" readonly placeholder="Select a code above">
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label>Clock From</label>
          <div class="clock-grid" id="clockFrom"></div>
        </div>
        <div class="form-group">
          <label>Clock To</label>
          <div class="clock-grid" id="clockTo"></div>
        </div>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label>Continuous / Joint?</label>
          <select id="continuous">
            <option value="N">No</option>
            <option value="Y">Yes (Continuous)</option>
            <option value="J">At Joint</option>
          </select>
        </div>
        <div class="form-group">
          <label>% CSA loss / mm</label>
          <input type="number" id="pctLoss" min="0" max="100" value="0">
        </div>
      </div>
      <div class="form-group">
        <label>Remarks</label>
        <input type="text" id="remarks" placeholder="e.g. at joint">
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="closeCodeModal()">Cancel</button>
        <button class="btn btn-success" onclick="saveObservation()">Save</button>
      </div>
    </div>
  </div>

  <script>
    // ========== MSCC 5 CODES ==========
    const MSCC = {
      Structural: [
        { code: 'CL', name: 'Crack Longitudinal', grade: 2 },
        { code: 'CC', name: 'Crack Circumferential', grade: 1 },
        { code: 'CR', name: 'Crack Radiating', grade: 2 },
        { code: 'CM', name: 'Cracks Multiple', grade: 3 },
        { code: 'FL', name: 'Fracture Longitudinal', grade: 3 },
        { code: 'FC', name: 'Fracture Circumferential', grade: 2 },
        { code: 'FR', name: 'Fracture Radiating', grade: 3 },
        { code: 'FM', name: 'Fractures Multiple', grade: 4 },
        { code: 'B', name: 'Broken', grade: 4 },
        { code: 'H', name: 'Hole', grade: 4 },
        { code: 'D', name: 'Deformed', grade: 4 },
        { code: 'XP', name: 'Collapsed', grade: 5 },
        { code: 'DI', name: 'Dropped Invert (brick)', grade: 3 },
        { code: 'JD(M)', name: 'Joint Displaced Medium', grade: 1 },
        { code: 'JD(L)', name: 'Joint Displaced Large', grade: 2 },
        { code: 'OJ(M)', name: 'Open Joint Medium', grade: 1 },
        { code: 'OJ(L)', name: 'Open Joint Large', grade: 2 },
        { code: 'S', name: 'Surface Damage', grade: 2 },
        { code: 'SW', name: 'Increased Roughness', grade: 1 },
        { code: 'SS', name: 'Spalling', grade: 2 },
        { code: 'SAP', name: 'Aggregate Projecting', grade: 3 },
        { code: 'SRP', name: 'Reinforcement Projecting', grade: 4 },
        { code: 'SRV', name: 'Reinforcement Visible', grade: 3 },
        { code: 'LXB', name: 'Lining Blistered / Internal Bulge', grade: 3 },
        { code: 'LXH', name: 'Lining Hole', grade: 4 },
        { code: 'LXS', name: 'Lining Crack / Split / Weld', grade: 3 },
        { code: 'LX', name: 'Lining Defect (general)', grade: 3 },
      ],
      'Service / O&M': [
        { code: 'RF', name: 'Roots Fine', grade: 1 },
        { code: 'RT', name: 'Roots Tap', grade: 2 },
        { code: 'RM', name: 'Roots Mass', grade: 4 },
        { code: 'IS', name: 'Infiltration Seeping', grade: 1 },
        { code: 'ID', name: 'Infiltration Dripping', grade: 2 },
        { code: 'IR', name: 'Infiltration Running', grade: 3 },
        { code: 'IG', name: 'Infiltration Gushing', grade: 5 },
        { code: 'EX', name: 'Exfiltration', grade: 3 },
        { code: 'DEE', name: 'Attached Encrustation', grade: 2 },
        { code: 'DEF', name: 'Attached Fouling', grade: 2 },
        { code: 'DEG', name: 'Attached Grease', grade: 2 },
        { code: 'DEZ', name: 'Other Attached Deposits', grade: 2 },
        { code: 'DES', name: 'Settled Fine', grade: 2 },
        { code: 'DER', name: 'Settled Coarse', grade: 3 },
        { code: 'DEC', name: 'Settled Hard / Compacted', grade: 3 },
        { code: 'OB', name: 'Other Obstacles', grade: 3 },
        { code: 'OBB', name: 'Obstacle Brick / Masonry', grade: 3 },
        { code: 'OBM', name: 'Obstacle Pipe Material', grade: 3 },
        { code: 'ING', name: 'Ingress of Soil', grade: 4 },
      ],
      Construction: [
        { code: 'JN', name: 'Junction', grade: 0 },
        { code: 'CN', name: 'Connection', grade: 0 },
        { code: 'CX', name: 'Defective Connection', grade: 2 },
        { code: 'CXI', name: 'Connection Intruding', grade: 3 },
        { code: 'JX', name: 'Defective Junction', grade: 2 },
        { code: 'SR', name: 'Sealing Ring Intruding', grade: 2 },
        { code: 'MH', name: 'Manhole (start)', grade: 0 },
        { code: 'IC', name: 'Inspection Chamber', grade: 0 },
        { code: 'MHF', name: 'Manhole (finish)', grade: 0 },
      ],
      Miscellaneous: [
        { code: 'WL', name: 'Water Level', grade: 0 },
        { code: 'SA', name: 'Survey Abandoned', grade: 0 },
        { code: 'REM', name: 'General Remark', grade: 0 },
        { code: 'CUW', name: 'Camera Under Water', grade: 0 },
        { code: 'SC', name: 'Shape / Dimension Change', grade: 0 },
        { code: 'MC', name: 'Material Change', grade: 0 },
        { code: 'VR', name: 'Vermin (Rat)', grade: 1 },
      ]
    };

    const scenarios = [
      {
        id: 'easy1', name: 'Domestic Lateral – Light Defects',
        desc: '150 mm VC residential run. Cracks, fine roots, open joint, seepage.',
        diff: 'easy', length: 45, material: 'Vitrified Clay (VC)', diameter: 150,
        defects: [

    function renderCurriculum() {
      const nav = document.getElementById('curriculum');
      let html = '', lastSec = '';
      curriculum.forEach(l => {
        if (l.section !== lastSec) {
          html += `<div class="section-title">${l.section}</div>`;
          lastSec = l.section;
        }
        const done = completed.includes(l.id);
        html += `<div class="lesson ${l.id === currentLesson ? 'active' : ''} ${done ? 'completed' : ''}" onclick="goTo('${l.id}')">
          <div class="lesson-icon">${done ? '✓' : ''}</div>
          <div class="lesson-title">${l.title}<div class="lesson-dur">${l.dur}</div></div>
        </div>`;
      });
      nav.innerHTML = html;
    }

    function updateProgress() {
      const pct = Math.round((completed.length / curriculum.length) * 100);
      document.getElementById('courseProgress').style.width = pct + '%';
      document.getElementById('progressText').textContent = pct + '% complete · ' + completed.length + '/' + curriculum.length + ' lessons';
    }

    function markComplete(id) {
      if (!completed.includes(id)) {
        completed.push(id);
        localStorage.setItem('cctv_completed', JSON.stringify(completed));
        updateProgress();
        renderCurriculum();
      }
    }

    function goTo(id) {
      currentLesson = id;
      localStorage.setItem('cctv_lesson', id);
      closeSidebar();
      renderCurriculum();
      const lesson = curriculum.find(l => l.id === id);
      document.getElementById('topTitle').textContent = lesson ? lesson.title : 'Course';
      const content = document.getElementById('content');
      content.innerHTML = '';
      const renderers = {
        intro: renderIntro, 'mscc-intro': renderMsccIntro, struct: renderStruct,
        service: renderService, construction: renderConstruction, quiz1: renderQuiz,
        'sim-select': renderSimSelect, 'sim-run': renderSimRun, wincan: renderWincan,
        complete: renderComplete
      };
      if (renderers[id]) renderers[id](content);
      window.scrollTo(0, 0);
    }

      const idx = curriculum.findIndex(l => l.id === currentLesson);

        </div>`;

    function selectOpt(el) {
      const q = el.dataset.q;
      document.querySelectorAll(`.quiz-opt[data-q="${q}"]`).forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      window._quizAnswers[q] = +el.dataset.a;
    }
    function gradeQuiz() {
      const qs = window._quiz;
      let correct = 0;
      qs.forEach((qu, i) => {
        const opts = document.querySelectorAll(`.quiz-opt[data-q="${i}"]`);
        opts.forEach(o => {
          o.classList.remove('correct', 'wrong');
          if (+o.dataset.a === qu.ans) o.classList.add('correct');
          if (window._quizAnswers[i] === +o.dataset.a && +o.dataset.a !== qu.ans) o.classList.add('wrong');
        });
        if (window._quizAnswers[i] === qu.ans) correct++;
      });
      const res = document.getElementById('quizResult');
      res.classList.remove('hidden');
      res.innerHTML = `<h3>Score: ${correct}/${qs.length}</h3>
        <p>${correct >= 4 ? 'Great work! You are ready for the practical simulator.' : 'Review the coding lessons and try again.'}</p>
        ${correct >= 4 ? '<button class="btn" style="margin-top:12px" onclick="markComplete(\'quiz1\'); nextLesson()">Continue to Practical →</button>' : ''}`;
      if (correct >= 4) markComplete('quiz1');
    }

    // ===== Simulator logic =====
    function move(dir) {
      if (!currentScenario) return;
      distance = Math.max(0, Math.min(currentScenario.length, +(distance + dir * 0.8).toFixed(1)));
      updateDistanceUI();
      updateDefectView();
      if (distance >= currentScenario.length) {
        stopPlay();
        setTimeout(() => { if (confirm('End of pipe. Finish and generate WinCan report?')) finishSim(); }, 300);
      }
    }
    function togglePause() {
      if (playing) stopPlay(); else startPlay();
    }
    function startPlay() {
      playing = true;
      document.getElementById('btnPause').textContent = 'Pause';
      playInterval = setInterval(() => move(1), 700);
    }
    function stopPlay() {
      playing = false;
      const b = document.getElementById('btnPause');
      if (b) b.textContent = 'Auto ▶';
      if (playInterval) clearInterval(playInterval);
      playInterval = null;
    }
    function updateDistanceUI() {
      const el = document.getElementById('distLabel');
      if (el) el.textContent = distance.toFixed(1) + ' m';
      const fill = document.getElementById('progressFill');
      if (fill && currentScenario) fill.style.width = (distance / currentScenario.length * 100) + '%';
    }
    function updateDefectView() {
      if (!currentScenario) return;
      currentDefect = currentScenario.defects.find(d => Math.abs(d.at - distance) <= 1.2) || null;
      const overlay = document.getElementById('defectOverlay');
      const info = document.getElementById('defectInfo');
      const btn = document.getElementById('btnCode');
      if (!overlay) return;
      if (currentDefect) {
        overlay.innerHTML = `<div class="defect-badge">DEFECT @ ${currentDefect.at} m</div>`;
        info.innerHTML = `<div class="title">Defect visible at ${currentDefect.at} m</div><div class="desc">${currentDefect.desc}</div>`;
        if (btn) btn.disabled = false;
        document.querySelector('.pipe-circle').style.borderColor = '#e74c3c';
      } else {
        overlay.innerHTML = '';
        info.innerHTML = `<div class="title">${distance === 0 ? 'Start of survey' : 'Clear pipe'}</div><div class="desc">No defect currently in view.</div>`;
        if (btn) btn.disabled = true;
        document.querySelector('.pipe-circle').style.borderColor = '#3a4a5c';
      }
    }
    function buildClockButtons() {
      ['clockFrom', 'clockTo'].forEach(id => {
        const grid = document.getElementById(id);
        if (!grid || grid.children.length) return;
        for (let i = 1; i <= 12; i++) {
          const b = document.createElement('button');
          b.className = 'clock-btn'; b.textContent = i;
          b.onclick = () => {
            grid.querySelectorAll('.clock-btn').forEach(x => x.classList.remove('selected'));
            b.classList.add('selected');
            if (id === 'clockFrom') clockFromSel = i; else clockToSel = i;
          };
          grid.appendChild(b);
        }
      });
    }
    function buildCodeTabs() {
      const tabs = document.getElementById('codeTabs');
      if (!tabs || tabs.children.length) return;
      Object.keys(MSCC).forEach(fam => {
        const t = document.createElement('button');
        t.className = 'code-tab' + (fam === 'Structural' ? ' active' : '');
        t.textContent = fam;
        t.onclick = () => {
          activeFamily = fam;
          document.querySelectorAll('.code-tab').forEach(x => x.classList.remove('active'));
          t.classList.add('active');
          renderCodeList();
        };
        tabs.appendChild(t);
      });
      renderCodeList();
    }
    function renderCodeList() {
      const list = document.getElementById('codeList');
      if (!list) return;
      list.innerHTML = '';
      MSCC[activeFamily].forEach(c => {
        const b = document.createElement('button');
        b.className = 'code-btn' + (selectedCode && selectedCode.code === c.code ? ' selected' : '');
        b.innerHTML = `<span class="c">${c.code}</span><br>${c.name}`;
        b.onclick = () => {
          selectedCode = c;
          document.getElementById('selectedCode').value = c.code + ' – ' + c.name;
          renderCodeList();
        };
        list.appendChild(b);
      });
    }
    function openCodeModal() {
      if (!currentDefect) return;
      selectedCode = null; clockFromSel = null; clockToSel = null;
      document.getElementById('selectedCode').value = '';
      document.getElementById('continuous').value = 'N';
      document.getElementById('pctLoss').value = '0';
      document.getElementById('remarks').value = '';
      document.getElementById('modalDist').textContent = '@ ' + distance.toFixed(1) + ' m';
      document.querySelectorAll('.clock-btn').forEach(b => b.classList.remove('selected'));
      renderCodeList();
      document.getElementById('codeModal').classList.add('open');
    }
    function closeCodeModal() { document.getElementById('codeModal').classList.remove('open'); }
    function saveObservation() {
      if (!selectedCode) { alert('Select an MSCC code'); return; }
      observations.push({
        distance: +distance.toFixed(1), code: selectedCode.code, name: selectedCode.name,
        grade: selectedCode.grade, clockFrom: clockFromSel, clockTo: clockToSel,
        continuous: document.getElementById('continuous').value,
        pct: parseInt(document.getElementById('pctLoss').value) || 0,
        remarks: document.getElementById('remarks').value, trueDefect: currentDefect
      });
      observations.sort((a,b) => a.distance - b.distance);
      renderObsList();
      closeCodeModal();
    }
    function renderObsList() {
      const list = document.getElementById('obsList');
      if (!list) return;
      if (!observations.length) {
        list.innerHTML = '<p style="color:var(--muted);font-size:0.85rem">No observations yet.</p>';
        return;
      }
      list.innerHTML = observations.map((o,i) =>
        `<div class="obs-item"><div><div class="code">${o.code}</div><div class="meta">${o.distance} m · ${o.clockFrom||'?'}–${o.clockTo||'?'} · ${o.continuous} · ${o.pct}%</div></div>
         <button class="remove" onclick="removeObs(${i})">×</button></div>`
      ).join('');
    }
    function removeObs(i) { observations.splice(i,1); renderObsList(); }

    function finishSim() {
      stopPlay();
      lastScore = scoreRun();
      markComplete('sim-run');
      goTo('wincan');
    }

    function scoreRun() {
      const trueDefs = currentScenario.defects;
      let score = 0, feedback = [], matched = new Set();
      const maxPer = 100 / Math.max(trueDefs.length, 1);
      let structHits = 0, omHits = 0;
      observations.forEach(obs => {
        let best = null, bestD = 999;
        trueDefs.forEach((td, idx) => {
          if (matched.has(idx)) return;
          const d = Math.abs(td.at - obs.distance);
          if (d < bestD && d <= 4) { bestD = d; best = { td, idx }; }
        });
        if (!best) {
          feedback.push({ good: false, title: obs.code + ' @ ' + obs.distance + ' m', msg: 'No matching defect nearby.', expected: null });
          return;
        }
        matched.add(best.idx);
        const td = best.td;
        let pts = 0, notes = [];
        if (obs.code === td.code) {
          pts += maxPer * 0.5; notes.push('Correct code');
          if (MSCC.Structural.some(c => c.code === td.code)) structHits++;
          if (MSCC['Service / O&M'].some(c => c.code === td.code)) omHits++;
        } else if (obs.code[0] === td.code[0]) { pts += maxPer * 0.2; notes.push('Same family'); }
        else notes.push('Wrong code');
        if (Math.abs(obs.distance - td.at) <= 1.5) { pts += maxPer * 0.2; notes.push('Good position'); }
        else if (Math.abs(obs.distance - td.at) <= 3) pts += maxPer * 0.1;
        if (obs.continuous === td.continuous) pts += maxPer * 0.1;
        if (obs.clockFrom && td.clockFrom) {
          const ok = Math.abs(obs.clockFrom - td.clockFrom) <= 2 || Math.abs(obs.clockFrom - td.clockFrom) >= 10;
          if (ok) pts += maxPer * 0.1;
        }
        if (Math.abs(obs.pct - td.pct) <= 10) pts += maxPer * 0.1;
        score += pts;
        feedback.push({ good: pts >= maxPer * 0.6, title: obs.code + ' @ ' + obs.distance + ' m',
          msg: notes.join(' · ') + ' → ' + Math.round(pts) + ' pts',
          expected: td.code + ' @ ' + td.at + ' m' });
      });
      trueDefs.forEach((td, idx) => {
        if (!matched.has(idx)) feedback.push({ good: false, title: 'Missed @ ' + td.at + ' m', msg: 'Expected ' + td.code, expected: td.desc });
      });
      if (matched.size === trueDefs.length) score = Math.min(100, score + 5);
      return { score: Math.round(Math.min(100, Math.max(0, score))), feedback, structHits, omHits };
    }

    // ========== WINCAN REPORT ==========
    function renderWincan(el) {
      if (!currentScenario || !lastScore) {
        el.innerHTML = `<div class="card"><p>Complete a practical inspection first.</p>
          <button class="btn" onclick="goTo('sim-select')">Go to Simulator</button></div>`;
        return;
      }
      const s = currentScenario;
      const date = new Date().toLocaleDateString('en-GB');
      const time = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

      // Build observation rows
      let obsRows = observations.map((o, i) => {
        const cont = o.continuous === 'Y' ? 'S' + String(i+1).padStart(2,'0') : (o.continuous === 'J' ? 'J' : '');
        const joint = o.continuous === 'J' ? 'J' : '';
        return `<tr>
          <td></td>
          <td></td>
          <td>${o.distance.toFixed(1)}</td>
          <td>${cont}</td>
          <td><strong>${o.code}</strong></td>
          <td>${joint}</td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td>${o.pct || ''}</td>
          <td>${o.clockFrom || ''}</td>
          <td>${o.clockTo || ''}</td>
          <td>${o.remarks || o.name}</td>
        </tr>`;
      }).join('');
      if (!obsRows) obsRows = '<tr><td colspan="14" style="text-align:center">No observations recorded</td></tr>';

      // Peak grades for summary
      const grades = observations.map(o => o.grade).filter(g => g > 0);
      const peakStruct = Math.max(0, ...observations.filter(o => MSCC.Structural.some(c => c.code === o.code)).map(o => o.grade));
      const peakOM = Math.max(0, ...observations.filter(o => MSCC['Service / O&M'].some(c => c.code === o.code)).map(o => o.grade));

      el.innerHTML = `
        <div class="lesson-header">
          <h1>WinCan-Style Final Inspection Sheet</h1>
          <div class="meta">Your practical run converted into a professional report format</div>
        </div>

        <div class="score-big">
          <div class="num">${lastScore.score}</div>
          <div class="label">Coding Accuracy Score</div>
        </div>

        <div class="card">
          <h3>Feedback</h3>
          ${lastScore.feedback.map(f =>
            `<div class="feedback-item ${f.good ? 'good' : 'bad'}"><strong>${f.title}</strong><br>${f.msg}
             ${f.expected ? `<div class="expected">Expected: ${f.expected}</div>` : ''}</div>`
          ).join('')}
        </div>

        <div class="card">
          <h3>WinCan / MSCC Inspection Report</h3>
          <p style="font-size:0.85rem;color:var(--muted);margin-bottom:12px">
            Layout follows the MSCC 5 Standard Coding Form (WinCan-compatible). Columns match the official observation sheet: Video/Photo Ref, Distance, Continuous defect, Code, Joint, Material, Band, Dimensions, %, Clock positions and Remarks.
          </p>
          <div class="wincan-sheet" id="wincanSheet">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
              <div class="logo">WinCan · MSCC 5 Inspection Report</div>
              <div style="font-size:0.75rem;color:#555">Training Mode</div>
            </div>
            <h2>Survey Header</h2>
            <div class="header-grid">
              <div><span>Project / Section:</span> <strong>SEC-${s.id.toUpperCase()}</strong></div>
              <div><span>Date:</span> <strong>${date}</strong></div>
              <div><span>Operator:</span> <strong>${operatorName || 'Trainee'}</strong></div>
              <div><span>Time:</span> <strong>${time}</strong></div>
              <div><span>Material:</span> <strong>${s.material}</strong></div>
              <div><span>Diameter:</span> <strong>${s.diameter} mm</strong></div>
              <div><span>Shape:</span> <strong>Circular</strong></div>
              <div><span>Length:</span> <strong>${s.length} m</strong></div>
              <div><span>Direction:</span> <strong>Downstream</strong></div>
              <div><span>Coding Standard:</span> <strong>MSCC 5 (WRc)</strong></div>
            </div>

            <h2>Observations</h2>
            <table>
              <thead>
                <tr>
                  <th>Video Ref.</th>
                  <th>Photo Ref.</th>
                  <th>Dist (m)</th>
                  <th>Cont defect</th>
                  <th>Code</th>
                  <th>Joint</th>
                  <th>Material</th>
                  <th>Band</th>
                  <th>Dim 1</th>
                  <th>Dim 2</th>
                  <th>%</th>
                  <th>Clock From</th>
                  <th>Clock To</th>
                  <th>Remarks</th>
                </tr>
              </thead>
              <tbody>${obsRows}</tbody>
            </table>

            <div class="summary-box">
              <strong>Condition Summary (simulated)</strong><br>
              Peak Structural Grade: <strong>${peakStruct || '–'}</strong> &nbsp;|&nbsp;
              Peak O&M Grade: <strong>${peakOM || '–'}</strong><br>
              Total Observations: <strong>${observations.length}</strong> &nbsp;|&nbsp;
              Coding Accuracy Score: <strong>${lastScore.score}/100</strong>
            </div>
            <p style="margin-top:10px;font-size:0.75rem;color:#666">
              Generated for training purposes. In live WinCan projects this data would export to database, GIS and client PDF reports.
            </p>
          </div>
          <p class="print-hint">On desktop you can print or screenshot this sheet for your records.</p>
        </div>

        <div class="btn-row">
          <button class="btn btn-secondary" onclick="goTo('sim-run')">← Back to Simulator</button>
          <button class="btn" onclick="markComplete('wincan'); nextLesson()">Complete Course →</button>
        </div>
      `;
    }

    function renderComplete(el) {
      markComplete('complete');
      const date = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
      el.innerHTML = `
        <div class="lesson-header">
          <h1>Course Complete</h1>
          <div class="meta">Congratulations</div>
        </div>
        <div class="cert">
          <h2>Certificate of Completion</h2>
          <p style="color:var(--muted)">This certifies that</p>
          <div class="name">${operatorName || 'Trainee'}</div>
          <p>has successfully completed</p>
          <p style="font-weight:600;margin:8px 0">CCTV Sewer Inspection Mastery<br>MSCC 5 Coding + WinCan-Style Reporting</p>
          <div class="date">${date}</div>
          <p style="margin-top:16px;font-size:0.8rem;color:var(--muted)">Training simulator · Not an official WRc or NASSCO certification</p>
        </div>
        <div class="card">
          <h3>What you achieved</h3>
          <ul>
            <li>Understood the MSCC 5 coding families and structure</li>
            <li>Practised identifying structural and service defects</li>
            <li>Completed a full virtual CCTV inspection run</li>
            <li>Generated a professional WinCan-style final inspection sheet</li>
          </ul>
        </div>
        <div class="card">
          <h3>Next steps</h3>
          <p>For official certification, pursue WRc / MSCC or NASSCO PACP training with an approved provider. Use this simulator to keep your coding sharp between jobs.</p>
        </div>
        <div class="btn-row">
          <button class="btn btn-secondary" onclick="goTo('sim-select')">Practice Another Scenario</button>
          <button class="btn" onclick="goTo('intro')">Back to Start</button>
        </div>
      `;
    }

    // Boot
    init();
  </script>
</body>
</html>
